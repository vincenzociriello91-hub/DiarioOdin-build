# Pubblica su Cloudflare il ponte veloce Claude <-> Odin (ponte/). Parte quando cambia ponte/.
# Segreto del repository: CLOUDFLARE_API_TOKEN (messo da Vincenzo, mai nei file). ID account in ponte/wrangler.toml.
name: Ponte Odin
on:
  push:
    branches: [main]
    paths: ["ponte/**", ".github/workflows/ponte.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pubblica il worker
        working-directory: ponte
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy 2>&1 | tee ../deploy.log
      - name: Salva indirizzo ed esito
        if: always()
        run: |
          mkdir -p ponte/esiti
          { echo "data: $(date -u '+%Y-%m-%d %H:%M UTC')"; echo "esito: ${{ job.status }}"
            grep -o 'https://[a-z0-9.-]*workers.dev' deploy.log | head -n 1 | sed 's/^/indirizzo: /'
            echo "--- ultime righe"; tail -n 25 deploy.log | sed 's/\x1b\[[0-9;]*m//g'; } > ponte/esiti/ultimo.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ponte/esiti/ultimo.txt
          git diff --cached --quiet && exit 0
          git commit -m "Ponte: esito della pubblicazione [skip ci]"
          git pull --rebase origin main
          git push
