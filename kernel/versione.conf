# Kernel installato sulla Odin 2 Portal (da Odin2_report/kernel_info.txt del 10/11/2026, LineageOS 24.0-20261102).
# Cambia a ogni aggiornamento di LineageOS che tocca il kernel. Lo aggiorna da solo il robot (kernel/robot.sh), che mette
# "auto" in KERNEL_RELEASE e CONFIG_IMPRONTA: le calcola la compilazione e si confrontano dopo con kernel_info.txt della Odin.
KERNEL_REPO=https://github.com/LineageOS/android_kernel_ayn_qcs8550
KERNEL_COMMIT=5646ff2f4a184a5c45e6f57d35668323efa608e3
KERNEL_RELEASE=auto
# sha256 delle righe CONFIG_ ordinate di /proc/config.gz sulla Odin
CONFIG_IMPRONTA=auto
# compilatore scritto in /proc/version sulla Odin: "based on r596125", clang 22.0.2
CLANG=clang-r596125
CLANG_SEGNO="based on r596125"
# numero di build del compilatore sulla Odin: nel confronto della configurazione si usa questo (vedi impronta in compila.sh)
CLANG_BUILD=15071444
# come lo configura LineageOS (BoardConfigCommon.mk di android_device_ayn_qcs8550-common)
DEFCONFIG="gki_defconfig vendor/kalama_GKI.config vendor/moorechip/kalama_GKI.config vendor/debugfs.config"
LINEAGE_BUILD=2026-11-09
